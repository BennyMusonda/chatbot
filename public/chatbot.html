<!DOCTYPE html>
<html lang="en">

<head>

    <!-- DOCUMENT INFORMATION -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messenger AI</title>

    <!-- CONNECT CSS -->

    <link rel="stylesheet" href="chatbot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>

    <!-- MAIN CHATBOT WINDOW -->

    <main>

        <!-- CHATBOT HEADER -->

        <div class="chat-heading">

            <div class="main-title">
                messenger <span>Ai</span>
            </div>

            <button id="clearChatBtn">
                <a><i class="fa-solid fa-trash"></i></a>
            </button>

        </div>


        <!-- CONNECTION STATUS -->

        <div class="connection-status" id="connectionStatus">

            <span class="status-indicator"></span>

            <span id="statusText">Checking connection...</span>

        </div>


        <!-- CHAT CONVERSATION AREA -->

        <div class="chat-container" id="chatContainer">

            <!-- WELCOME MESSAGE -->

            <div class="message-row bot">

                <div class="message-bubble">

                    Hello! I'm Messenger AI.

                    <br><br>

                    I'm here to chat, answer questions and help you learn.

                    <br><br>

                    What would you like to talk about?

                </div>

            </div>

        </div>


        <!-- MESSAGE INPUT AREA -->

        <div class="input-field">

            <input
                type="text"
                id="textField"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button class="send-btn" id="sendBtn" type="button">

                ➤

            </button>

        </div>

    </main>


    <!-- LOAD OFFLINE KNOWLEDGE FIRST -->

    <script src="knowledge/knowledge.js"></script>


    <!-- LOAD CHATBOT FUNCTIONALITY -->

    <script src="chatbot.js"></script>


</body>

</html>
