<!DOCTYPE html>
<html lang="en">

<head>

    <!-- DOCUMENT INFORMATION -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messenger AI</title>

    <!-- CONNECT CSS -->

    <link rel="stylesheet" href="chatbot.css">

</head>

<body>

    <!-- MAIN CHATBOT WINDOW -->

    <main>

        <!-- CHATBOT HEADER -->

        <div class="chat-heading">

            <div class="main-title">
                messenger <span>Ai</span>
            </div>

            <button id="clearChatBtn">
                Clear Chat
            </button>

        </div>


        <!-- CONNECTION STATUS -->

        <div class="connection-status" id="connectionStatus">

            <span class="status-indicator"></span>

            <span id="statusText">Checking connection...</span>

        </div>


        <!-- CHAT CONVERSATION AREA -->

        <div class="chat-container" id="chatContainer">

            <!-- WELCOME MESSAGE -->

            <div class="message-row bot">

                <img
                    src="imgs/PXL_20260828_133354894~2.jpg"
                    alt="Messenger AI"
                >

                <div class="message-bubble">

                    Hello! I'm Messenger AI.

                    <br><br>

                    I'm here to chat, answer questions and help you learn.

                    <br><br>

                    What would you like to talk about?

                </div>

            </div>

        </div>


        <!-- MESSAGE INPUT AREA -->

        <div class="input-field">

            <input
                type="text"
                id="textField"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button class="send-btn" id="sendBtn" type="button">

                ➤

            </button>

        </div>

    </main>


    <!-- LOAD OFFLINE KNOWLEDGE FIRST -->

    <script src="knowledge/knowledge.js"></script>


    <!-- LOAD CHATBOT FUNCTIONALITY -->

    <script src="chatbot.js"></script>


</body>

</html>
