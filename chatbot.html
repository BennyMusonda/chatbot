<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Document metadata. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat bot</title>

    <!-- Stylesheets for the chatbot and its icons. -->
    <link rel="stylesheet" href="chatbot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <!-- Main chatbot page content. -->
    <main>
        <div class="main-content">
            <!-- Chatbot title. -->
            <div class="main-title">messenger <span>Ai</span></div>

            <!-- Chat conversation area. -->
            <div class="chat-container" id="chatContainer">
                <!-- Message input field and send control. -->
                <div class="input-field">
                    <input type="text" id="textField" placeholder="Type a message...">

                    <!-- Send button with a play icon. -->
                    <div class="send-btn" id="sendBtn">
                        <a href="#"><i class="fa-solid fa-play"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Load chatbot behavior after the HTML is parsed. -->
    <script src="chatbot.js" defer></script>
</body>
</html>
